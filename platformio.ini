; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; The Xtensa linker cannot write the map file into a path containing
; non-ASCII characters (the "Š" in this user's home directory), so build
; artifacts are kept in an ASCII-only directory.
[platformio]
build_dir = C:/Temp/keypad_build

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  chris--a/Keypad
